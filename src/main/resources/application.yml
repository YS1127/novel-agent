spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: novel-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/novel_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:novel}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: ${SERVER_PORT:8080}
  address: 127.0.0.1
